allprojects {
    repositories {
        google()
        mavenCentral()
    }
    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                }
            }
        }
    }
}

// posthog_flutter 5.28.0 declares com.posthog:posthog-android:[3.51.0,4.0.0].
// The inclusive upper bound now resolves 4.0.x, whose API the plugin's Kotlin
// does not compile against. Hold the 3.x line the app was built on.
subprojects {
    configurations.configureEach {
        resolutionStrategy.force 'com.posthog:posthog-android:3.77.1'
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}


tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
