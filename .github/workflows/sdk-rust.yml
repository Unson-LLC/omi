name: Rust SDK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sdks/rust/**"
      - ".github/workflows/sdk-rust.yml"

concurrency:
  group: sdk-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: [self-hosted, Linux, wsl-linux]
    defaults:
      run:
        working-directory: sdks/rust/omi-device
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust/omi-device
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test --locked
