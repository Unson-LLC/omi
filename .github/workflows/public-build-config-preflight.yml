name: Public Build Configuration Preflight

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: public-build-config-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: ${{ matrix.environment }} configuration
    runs-on: [self-hosted, Linux, wsl-linux]
    strategy:
      fail-fast: false
      matrix:
        environment: [development, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          lfs: false

      - name: Verify reviewed public build configuration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/preflight_public_build_config.py \
            --all \
            --environment "${{ matrix.environment }}"
